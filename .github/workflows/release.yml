name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-24.04
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: darwin_arm64
            runner: macos-15
    env:
      CGO_ENABLED: '1'
      BUILD_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Install offline-suite tools
        if: matrix.platform == 'linux_amd64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Test offline suite
        if: matrix.platform == 'linux_amd64'
        run: make test TEST_FLAGS=-count=1
      - name: Check generated module reference
        if: matrix.platform == 'linux_amd64'
        run: make check-generated
      - name: Check web UI
        if: matrix.platform == 'linux_amd64'
        run: make webui-check
      - name: Check Claude worker
        if: matrix.platform == 'linux_amd64'
        run: make claude-worker-check
      - name: Install lint tools
        if: matrix.platform == 'linux_amd64'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/tools/cmd/deadcode@v0.51.0
      - name: Lint
        if: matrix.platform == 'linux_amd64'
        run: make lint
      - name: Test commands
        if: matrix.platform != 'linux_amd64'
        run: make test TEST_PACKAGES='./apps/mekugi/cmd/mekugi ./apps/mekugi/cmd/mekugi-exec'
      - name: Test welcome and linked version
        run: |
          MEKUGI_TEST_BUILD_VERSION="$BUILD_TAG" make test TEST_PACKAGES=./apps/mekugi/internal/launch TEST_RUN='^(TestMekugi(BuildVersion|LinkedBuildVersion)|TestNativeWelcome|TestUISnapshotNativeWelcome)' TEST_FLAGS="-ldflags='-X github.com/yusing/mekugi/apps/mekugi/internal/launch.buildVersion=$BUILD_TAG'"
      - name: Install native Linux build dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libcap-dev libssl-dev
      - name: Test and package native runtime
        env:
          CARGO_BUILD_JOBS: '2'
          PLATFORM: ${{ matrix.platform }}
        run: |
          make test-native
          make package-native NATIVE_ARCHIVE="$RUNNER_TEMP/artifacts/mekugi-native_${PLATFORM}.tar.gz"
          bin/native/mekugi-app-server --help
      - name: Build and package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(go env GOOS)_$(go env GOARCH)" = "$PLATFORM"
          package_dir="$RUNNER_TEMP/package"
          mkdir -p "$package_dir" "$RUNNER_TEMP/artifacts"
          make build-binaries BUILD_OUTPUT="$package_dir" BUILD_LDFLAGS="-s -w -X github.com/yusing/mekugi/apps/mekugi/internal/launch.buildVersion=$BUILD_TAG"
          "$package_dir/mekugi" --help
          cp LICENSE "$package_dir/"
          tar -czf "$RUNNER_TEMP/artifacts/mekugi_${PLATFORM}.tar.gz" -C "$package_dir" mekugi mekugi-exec LICENSE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mekugi_${{ matrix.platform }}
          path: ${{ runner.temp }}/artifacts/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mekugi_*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true
      - name: Publish archives and checksums
        working-directory: ${{ runner.temp }}/artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum ./*.tar.gz > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --verify-tag --generate-notes
          fi
