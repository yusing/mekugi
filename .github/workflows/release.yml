name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-24.04
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: darwin_arm64
            runner: macos-15
    env:
      CGO_ENABLED: '1'
      BUILD_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: internal/claude/bridge/package-lock.json
      - name: Generate embedded assets
        run: make preview-assets
      - name: Check Claude bridge offline
        run: make test-claude
      - name: Install offline-suite tools
        if: matrix.platform == 'linux_amd64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Test offline suite
        if: matrix.platform == 'linux_amd64'
        run: make test TEST_FLAGS=-count=1
      - name: Install lint tools
        if: matrix.platform == 'linux_amd64'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/tools/cmd/deadcode@v0.51.0
      - name: Lint
        if: matrix.platform == 'linux_amd64'
        run: make lint
      - name: Test commands
        if: matrix.platform != 'linux_amd64'
        run: make test TEST_PACKAGES='./cmd/mekugi ./cmd/mekugi-exec'
      - name: Test welcome and linked version
        run: |
          MEKUGI_TEST_BUILD_VERSION="$BUILD_TAG" make test TEST_PACKAGES=./internal/router TEST_RUN='^(TestMekugi(BuildVersion|LinkedBuildVersion)|TestNativeWelcome|TestUISnapshotNativeWelcome)' TEST_FLAGS="-ldflags='-X github.com/yusing/mekugi/internal/router.buildVersion=$BUILD_TAG'"
      - name: Build and package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(go env GOOS)_$(go env GOARCH)" = "$PLATFORM"
          package_dir="$RUNNER_TEMP/package"
          mkdir -p "$package_dir" "$RUNNER_TEMP/artifacts"
          go build -trimpath -ldflags="-s -w -X github.com/yusing/mekugi/internal/router.buildVersion=$BUILD_TAG" -o "$package_dir/" ./cmd/mekugi ./cmd/mekugi-exec
          make build-claude-bridge CLAUDE_BRIDGE_DIR="$package_dir/claude-bridge"
          "$package_dir/mekugi" --help
          cp LICENSE "$package_dir/"
          tar -czf "$RUNNER_TEMP/artifacts/mekugi_${PLATFORM}.tar.gz" -C "$package_dir" mekugi mekugi-exec claude-bridge LICENSE
          make test-claude-package CLAUDE_PACKAGE_DIR="$package_dir"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: mekugi_${{ matrix.platform }}
          path: ${{ runner.temp }}/artifacts/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: mekugi_*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true
      - name: Publish archives and checksums
        working-directory: ${{ runner.temp }}/artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum ./*.tar.gz > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --verify-tag --generate-notes
          fi
