name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.platform }}
    permissions:
      actions: read
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-24.04
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: darwin_arm64
            runner: macos-15
    env:
      CGO_ENABLED: '1'
      BUILD_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-v1-${{ runner.os }}-${{ hashFiles('apps/mekugi/internal/webui/app/bun.lock') }}
          restore-keys: |
            bun-v1-${{ runner.os }}-
      - name: Install offline-suite tools
        if: matrix.platform == 'linux_amd64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Test offline suite
        if: matrix.platform == 'linux_amd64'
        run: make test TEST_FLAGS=-count=1
      - name: Check generated module reference
        if: matrix.platform == 'linux_amd64'
        run: make check-generated
      - name: Check web UI
        if: matrix.platform == 'linux_amd64'
        run: make webui-check
      - name: Cache lint tools
        if: matrix.platform == 'linux_amd64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin/golangci-lint
            ~/go/bin/deadcode
          key: lint-tools-v1-${{ matrix.platform }}-${{ hashFiles('go.work') }}-v2.14.0-v0.51.0
      - name: Install lint tools
        if: matrix.platform == 'linux_amd64'
        run: |
          command -v golangci-lint >/dev/null || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          command -v deadcode >/dev/null || go install golang.org/x/tools/cmd/deadcode@v0.51.0
      - name: Lint
        if: matrix.platform == 'linux_amd64'
        run: make lint
      - name: Test commands
        if: matrix.platform != 'linux_amd64'
        run: make test TEST_PACKAGES='./apps/mekugi/cmd/mekugi ./apps/mekugi/cmd/mekugi-exec'
      - name: Test welcome and linked version
        run: |
          MEKUGI_TEST_BUILD_VERSION="$BUILD_TAG" make test TEST_PACKAGES=./apps/mekugi/internal/launch TEST_RUN='^(TestMekugi(BuildVersion|LinkedBuildVersion)|TestNativeWelcome|TestUISnapshotNativeWelcome)' TEST_FLAGS="-ldflags='-X github.com/yusing/mekugi/apps/mekugi/internal/launch.buildVersion=$BUILD_TAG'"
      - name: Resolve native runtime archive key
        id: native_key
        env:
          PLATFORM: ${{ matrix.platform }}
          RUNNER_LABEL: ${{ matrix.runner }}
          RECIPE_HASH: ${{ hashFiles('.github/workflows/release.yml', 'Makefile', 'runtime/build.py') }}
        run: |
          codex_sha="$(git -C runtime/codex rev-parse HEAD)"
          image="$RUNNER_LABEL-${ImageVersion:-$GITHUB_RUN_ID}"
          key="$(printf '%s\n' "$PLATFORM" "$image" "$codex_sha" "$RECIPE_HASH" | shasum -a 256 | cut -d' ' -f1)"
          echo "name=mekugi_${PLATFORM}-$key" >> "$GITHUB_OUTPUT"
      - name: Cache packaged native runtime
        id: native_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/artifacts/mekugi-native_${{ matrix.platform }}.tar.gz
          key: native-bundle-v2-${{ steps.native_key.outputs.name }}
      - name: Restore packaged native runtime from main
        id: native_artifact
        if: steps.native_cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.native_key.outputs.name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Artifact retention is independent of the compiler cache's LRU eviction.
          if ! candidates="$(gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="$ARTIFACT_NAME" -F per_page=100 --jq '
              .artifacts[] | select(.expired == false and .workflow_run.head_branch == "main") | .workflow_run.id
            ')"; then
            echo "::warning::Could not list matching native archives; building locally."
            exit 0
          fi
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            if ! trusted="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" | jq -r --arg repo "$GITHUB_REPOSITORY" '
              .path == ".github/workflows/release.yml" and .event == "push" and .head_branch == "main" and
                .conclusion == "success" and .head_repository.full_name == $repo
            ')"; then
              echo "::warning::Could not verify native archive source run $run_id."
              continue
            fi
            [[ "$trusted" == 'true' ]] || continue
            download="$RUNNER_TEMP/native-artifact"
            archive="$download/mekugi-native_${PLATFORM}.tar.gz"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$download" ||
               [[ ! -s "$archive" ]]; then
              echo "::warning::Could not restore native archive from run $run_id; building locally."
              exit 0
            fi
            mkdir -p "$RUNNER_TEMP/artifacts"
            mv "$archive" "$RUNNER_TEMP/artifacts/"
            echo "restored=true" >> "$GITHUB_OUTPUT"
            break
          done <<< "$candidates"
      - name: Install native Linux build dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libcap-dev libssl-dev
      - name: Enable unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          # Match upstream Codex CI on the disposable Ubuntu runners.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-v1-${{ matrix.platform }}-${{ hashFiles('runtime/codex/codex-rs/Cargo.lock') }}
          restore-keys: |
            cargo-deps-v1-${{ matrix.platform }}-
      - name: Cache prebuilt V8 artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/codex/codex-rs/target/v8-artifacts
          key: v8-artifacts-v1-${{ matrix.platform }}-${{ hashFiles('runtime/codex/third_party/v8/rusty_v8_*_release_manifests.sha256') }}
      - name: Test native runtime
        env: &native_env
          CARGO_BUILD_JOBS: ${{ runner.os == 'Linux' && '4' || '2' }}
          CARGO_INCREMENTAL: '0'
          # Use system Git for V8's nested Git dependencies instead of Cargo's libgit2 transport.
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          PLATFORM: ${{ matrix.platform }}
          RUSTC_WRAPPER: sccache
        run: |
          # App-server integration fixtures use debug-only startup options.
          make test-native NATIVE_PROFILE=dev-small
      - name: Package native runtime
        if: steps.native_cache.outputs.cache-hit != 'true' && steps.native_artifact.outputs.restored != 'true'
        env: *native_env
        run: |
          make package-native NATIVE_ARCHIVE="$RUNNER_TEMP/artifacts/mekugi-native_${PLATFORM}.tar.gz"
      - name: Build and package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(go env GOOS)_$(go env GOARCH)" = "$PLATFORM"
          package_dir="$RUNNER_TEMP/package"
          mkdir -p "$package_dir" "$RUNNER_TEMP/artifacts"
          make webui build
          go build -trimpath -ldflags="-s -w -X github.com/yusing/mekugi/apps/mekugi/internal/launch.buildVersion=$BUILD_TAG" -o "$package_dir/" ./apps/mekugi/cmd/mekugi ./apps/mekugi/cmd/mekugi-exec
          native_files=(mekugi-app-server codex-code-mode-host mekugi-models.json)
          if [ "$RUNNER_OS" = Linux ]; then
            native_files+=(bwrap)
          fi
          tar -xzf "$RUNNER_TEMP/artifacts/mekugi-native_${PLATFORM}.tar.gz" -C "$package_dir" "${native_files[@]}"
          cp LICENSE "$package_dir/"
          cp runtime/codex/NOTICE "$package_dir/NOTICE"
          mkdir -p "$package_dir/licenses"
          cp runtime/codex/LICENSE "$package_dir/licenses/codex.txt"
          if [ "$RUNNER_OS" = Linux ]; then
            cp runtime/codex/codex-rs/vendor/bubblewrap/COPYING "$package_dir/licenses/bubblewrap.txt"
          fi
          tar -czf "$RUNNER_TEMP/artifacts/mekugi_${PLATFORM}.tar.gz" -C "$package_dir" .
      - name: Install and smoke-test the release archive
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          smoke="$RUNNER_TEMP/install-smoke"
          mkdir -p "$smoke/bin" "$smoke/home"
          export RELEASE_FIXTURE="$smoke"
          archive="mekugi_${PLATFORM}.tar.gz"
          # Serve the exact release archive and checksum without publishing first.
          (
            cd "$RUNNER_TEMP/artifacts"
            shasum -a 256 "./$archive" > "$smoke/SHA256SUMS"
          )
          cat > "$smoke/bin/curl" <<'SH'
          #!/bin/sh
          set -eu
          release=https://github.com/yusing/mekugi/releases/latest/download
          case "$2" in
            "$release/SHA256SUMS")
              cp "$RELEASE_FIXTURE/SHA256SUMS" "$4" ;;
            "$release/mekugi_${PLATFORM}.tar.gz")
              cp "$RUNNER_TEMP/artifacts/mekugi_${PLATFORM}.tar.gz" "$4" ;;
            *) exit 2 ;;
          esac
          SH
          chmod +x "$smoke/bin/curl"
          HOME="$smoke/home" PATH="$smoke/bin:$PATH" sh install.sh
          installed="$smoke/home/.local/bin"
          "$installed/mekugi" --help
          "$installed/mekugi-exec" --created-path ''
          "$installed/mekugi-app-server" --help
          "$installed/codex-code-mode-host" --help
          test -s "$installed/mekugi-models.json"
          if [[ "$RUNNER_OS" == Linux ]]; then
            "$installed/bwrap" --unshare-user --unshare-net \
              --ro-bind / / -- /bin/true
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native_key.outputs.name || format('mekugi_{0}', matrix.platform) }}
          path: ${{ runner.temp }}/artifacts/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mekugi_*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true
      - name: Publish archives and checksums
        working-directory: ${{ runner.temp }}/artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum ./*.tar.gz > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --verify-tag --generate-notes
          fi
